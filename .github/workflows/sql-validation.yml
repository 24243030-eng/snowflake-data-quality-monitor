
name: Snowflake Data Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check SQL project files
        run: |
          python - <<'PY'
          from pathlib import Path

          sql_dir = Path("sql")
          files = list(sql_dir.glob("*.sql")) if sql_dir.exists() else []

          if not files:
              raise SystemExit("No SQL files found in the sql/ directory")

          for file in files:
              if not file.read_text().strip():
                  raise SystemExit(f"Empty SQL file: {file}")
              print(f"Validated: {file}")

          print("All SQL files passed the basic checks.")
          PY
